name: Daily Renae Upload Check

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Historical date in India, e.g. 2026-08-21. Leave empty for rolling 24 hours."
        required: false
        type: string

  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Renae Upload Tracker
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |

          if [ -n "$TARGET_DATE" ]; then
            echo "Checking historical date: $TARGET_DATE"
            python tracker.py --date "$TARGET_DATE"
          else
            echo "Checking previous rolling 24 hours"
            python tracker.py
          fi

      - name: Save results to repository
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/

          if git diff --cached --quiet; then
            echo "No new result changes."
          else
            git commit -m "Update Renae upload results"
            git push
          fi
