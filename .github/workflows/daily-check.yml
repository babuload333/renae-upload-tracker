name: Daily Renae Upload Check

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional UTC date to check, e.g. 2026-08-21"
        required: false
        type: string

  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install collectors
        run: |
          python -m pip install --upgrade pip
          pip install "instaloader>=4.15.3"
          go install github.com/tamnd/tiktok-cli/cmd/tt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run upload tracker
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python tracker.py --date "$TARGET_DATE"
          else
            python tracker.py
          fi

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Update upload check results"
          git push
